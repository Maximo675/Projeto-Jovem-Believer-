# render.yaml — Configuração de deploy automático no Render.com
# Documentação: https://render.com/docs/render-yaml-spec

services:
  - type: web
    name: wingedmind-platform
    runtime: python
    region: oregon        # Altere para "frankfurt" se quiser servidor mais perto do Brasil
    plan: free            # "starter" para produção sem sleep (U$ 7/mês)
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && gunicorn --worker-class gthread -w 1 --threads 4 --timeout 120 run:app --bind 0.0.0.0:$PORT
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true       # Render gera automaticamente uma chave segura
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: wingedmind-db
          property: connectionString
      # IA: Mock mode para QA (sem Ollama nem OpenAI key no Render)
      - key: USE_MOCK_AI
        value: "true"
      - key: USE_OLLAMA
        value: "false"
      # Dummy key evita crash do openai SDK durante inicialização do worker
      # (o SDK cria proxies lazy que falham se não houver nenhuma key definida)
      - key: OPENAI_API_KEY
        value: "dummy-not-used-mock-mode"
      # Para habilitar IA real: troque USE_MOCK_AI para "false" e OPENAI_API_KEY pela chave real

databases:
  - name: wingedmind-db
    databaseName: wingedmind
    user: wingedmind_user
    plan: free            # PostgreSQL gratuito (90 dias no free tier do Render)
    region: oregon
